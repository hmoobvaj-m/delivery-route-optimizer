name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-check:
    name: Repository Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required repository files
        run: |
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f docker-compose.yml

      - name: Prevent committed secret files by filename
        run: |
          FOUND=$(find . \( -name ".env" -o -name "*.pem" -o -name "*.key" \))
          if [ -n "$FOUND" ]; then
            echo "Forbidden files found:"
            echo "$FOUND"
            exit 1
          fi

  api-check:
    name: API Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: delivery_routes_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d delivery_routes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: .

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/delivery_routes_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev]"

      - name: Run Ruff
        run: |
          ruff check apps/api

      - name: Run API tests
        run: |
          python -m pytest apps/api